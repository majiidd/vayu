name: Homebrew

# Publishing a final release updates the formula in the tap majiidd/homebrew-vayu, so that
# `brew install majiidd/vayu/vayu` installs it. Prereleases are skipped. Needs the
# HOMEBREW_TAP_TOKEN secret: a fine-grained token with contents read and write on the tap.
# Run by hand to republish the formula of an existing release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  tap:
    name: update the tap
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Download the release's formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern vayu.rb

      - name: Check every archive against the formula
        run: |
          awk '/^ *url "/ { gsub(/"/, "", $2); url = $2 }
               /^ *sha256 "/ { gsub(/"/, "", $2); print $2 "  " url }' vayu.rb > pairs
          test "$(wc -l < pairs)" -eq 4
          while read -r sum url; do
            actual=$(curl -fsSL --retry 3 "$url" | sha256sum | cut -d' ' -f1)
            test "$actual" = "$sum" || { echo "checksum mismatch for $url" >&2; exit 1; }
            echo "ok $url"
          done < pairs

      - uses: actions/checkout@v4
        with:
          repository: majiidd/homebrew-vayu
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit the formula
        run: |
          mkdir -p tap/Formula
          cp vayu.rb tap/Formula/vayu.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/vayu.rb
          if git diff --cached --quiet; then
            echo "The formula is already up to date."
            exit 0
          fi
          git commit -m "vayu ${TAG#v}"
          git push

  install:
    name: brew install (${{ matrix.os }})
    needs: tap
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - run: brew install majiidd/vayu/vayu
      - run: brew test vayu
      - run: vayu --version | grep -F "${TAG#v} (vayu-download)"
