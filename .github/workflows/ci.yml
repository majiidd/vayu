name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the exact tested toolchain.
      - run: make toolchain
      # Keep debug assertions enabled: recovery tests exercise injected crash points.
      - run: make ci

  build:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
            macos: "11.0"
          # Certificate verification requires SecTrustEvaluateWithError (macOS 10.14+).
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            macos: "10.14"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}
    steps:
      - uses: actions/checkout@v7
      - if: endsWith(matrix.target, '-musl')
        run: make musl-deps
      - run: make release
      - run: make check-binary
      - name: Smoke test on musl and glibc distributions
        if: runner.os == 'Linux'
        run: make smoke
      - run: make package
      - name: Test the native installer against the packaged binary
        if: runner.os == 'macOS' || endsWith(matrix.target, '-musl')
        run: make test-installer
      - name: Test the installer under BusyBox sh
        if: endsWith(matrix.target, '-musl')
        run: make test-installer-busybox
      - uses: actions/upload-artifact@v7
        with:
          name: vayu-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  distribution:
    name: release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: vayu-*
          path: dist
          merge-multiple: true
      - name: Verify tag, combine checksums, and include the installer
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          make dist
          make -s release-notes > /dev/null
      - name: Test the assembled release
        run: make test-installer
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  audit:
    name: licenses and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2
