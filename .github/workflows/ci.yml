name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the exact tested toolchain.
      - run: make toolchain
      - run: make fmt-check
      - run: make clippy
      - run: make test

  portable-linux:
    name: musl build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - run: make musl-deps
      - run: make release
      - name: Verify the binary has no runtime library dependencies
        run: make check-binary
      - name: Smoke test on musl and glibc distributions
        run: make smoke IMAGES="alpine:latest debian:stable-slim fedora:latest"
      - name: Package, then install with the release installer under BusyBox sh
        run: make package checksums test-installer

  audit:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
