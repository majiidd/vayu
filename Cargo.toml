[package]
name = "vayu"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "Vayu (وایو): a resilient command-line downloader for slow, unstable, and high-latency networks"
license = "MIT"
repository = "https://github.com/majiidd/vayu"
homepage = "https://github.com/majiidd/vayu"
readme = "README.md"
keywords = ["download", "http", "cli", "resume", "proxy"]
categories = ["command-line-utilities", "network-programming"]
# The crate holds what `cargo install` and the tests need; release tooling stays in the repository.
include = ["/src/**", "/tests/**", "/docs/*.md", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[[bin]]
name = "vayu"
path = "src/main.rs"

[dependencies]
bytes = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
crossterm = { version = "0.29", default-features = false }
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
httpdate = "1"
libc = "0.2"
percent-encoding = "2"
rustls = { version = "0.23", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "socks", "stream", "cookies", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
unicode-width = "0.2"
url = "2.5"

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
rustls-native-certs = "0.8"
webpki-root-certs = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
